# Render Blueprint: New → Blueprint → pick this repo.
# Free plan: web service + Postgres + Key Value work; background workers are a
# paid feature, so the free setup runs Celery beat+worker only if you upgrade
# (without them the site works; prices and exchange rates just don't refresh).
services:
  - type: web
    name: pcbuilder-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pcbuilder-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pcbuilder-redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: pcbuilder-api.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://pcbuilder-api.onrender.com,https://pcbuilder.onrender.com
      - key: FRONTEND_URL
        value: https://pcbuilder.onrender.com
      - key: RUN_MIGRATIONS
        value: "1"
      - key: SEED_DEMO_DATA
        value: "1"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PAYMENT_PROVIDER
        value: fake

  - type: web
    name: pcbuilder
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://pcbuilder-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  - type: keyvalue
    name: pcbuilder-redis
    plan: free
    ipAllowList: []

databases:
  - name: pcbuilder-db
    plan: free
    databaseName: pcbuilder
    user: pcbuilder
