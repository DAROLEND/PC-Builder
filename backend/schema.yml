      - id
      - item
      - last_notified_at
    WatchItem:
      type: object
      description: What a watch points at, flattened for lists (profile page, bot).
      properties:
        kind:
          $ref: '#/components/schemas/WatchItemKindEnum'
        name:
          type: string
        path:
          type: string
          description: Site path, e.g. /catalog/<slug> or /builds/<id>.
        image:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
      required:
      - category
      - image
      - kind
      - name
      - path
    WatchItemKindEnum:
      enum:
      - component
      - build
      type: string
      description: |-
        * `component` - component
        * `build` - build
    WatchRequest:
      type: object
      properties:
        component:
          type: integer
          nullable: true
        build:
          type: integer
          nullable: true
        target_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: USD. Alert once the price reaches it (optional).
        threshold_percent:
          type: integer
          maximum: 50
          minimum: 1
          description: Alert when the price moves this much, either way.
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
