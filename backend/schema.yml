          maxLength: 128
        slug:
          type: string
          minLength: 1
          maxLength: 160
          pattern: ^[-a-zA-Z0-9_]+$
        sku:
          type: string
          minLength: 1
          maxLength: 64
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Price in USD
        specs:
          type: object
          additionalProperties: {}
        is_active:
          type: boolean
        category_id:
          type: integer
          writeOnly: true
        manufacturer_id:
          type: integer
          writeOnly: true
