openapi: 3.0.3
info:
  title: PC Builder API
  version: 1.0.0
  description: 'PC configurator: component catalog, builds with compatibility checks,
    orders, statistics and an AI build advisor.'
paths:
  /api/advisor/:
    post:
      operationId: advisor_create
      description: |-
        Recommend a complete, compatible build for a budget and use case.

        Logged-in users only and rate limited: each call may cost LLM tokens.
      tags:
      - advisor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvisorRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdvisorRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdvisorRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvisorResponse'
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: auth_me_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: JWT login, rate limited per IP against password guessing.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/builds/:
    get:
      operationId: builds_list
      parameters:
      - in: query
        name: component
        schema:
          type: number
        description: Only builds that contain this component id.
      - in: query
        name: is_public
        schema:
          type: boolean
      - in: query
        name: max_total
        schema:
          type: number
      - in: query
        name: min_total
        schema:
          type: number
      - in: query
        name: mine
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: owner
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - builds
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBuildListList'
          description: ''
    post:
      operationId: builds_create
      tags:
      - builds
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BuildWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BuildWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildDetail'
          description: ''
  /api/builds/{id}/:
    get:
      operationId: builds_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this build.
        required: true
      tags:
      - builds
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildDetail'
          description: ''
    put:
      operationId: builds_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this build.
        required: true
      tags:
      - builds
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BuildWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BuildWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildDetail'
          description: ''
    patch:
      operationId: builds_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this build.
        required: true
      tags:
      - builds
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBuildWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBuildWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBuildWriteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildDetail'
          description: ''
    delete:
      operationId: builds_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this build.
        required: true
      tags:
      - builds
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/builds/{id}/clone/:
    post:
      operationId: builds_clone_create
      description: Copy a visible build (e.g. someone's public build) into your own
        builds.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this build.
        required: true
      tags:
      - builds
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildDetail'
          description: ''
  /api/builds/{id}/comments/:
    get:
      operationId: builds_comments_list
      summary: List build comments
      parameters:
      - in: query
        name: component
        schema:
          type: number
        description: Only builds that contain this component id.
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this build.
        required: true
      - in: query
        name: is_public
        schema:
          type: boolean
      - in: query
        name: max_total
        schema:
          type: number
      - in: query
        name: min_total
        schema:
          type: number
      - in: query
        name: mine
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: owner
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - builds
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
          description: ''
    post:
      operationId: builds_comments_create
      summary: Comment on a build
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this build.
        required: true
      tags:
      - builds
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CommentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
  /api/builds/{id}/compatibility/:
    get:
      operationId: builds_compatibility_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this build.
        required: true
      tags:
      - builds
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatibilityReport'
          description: ''
  /api/categories/:
    get:
      operationId: categories_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - categories
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/categories/{slug}/:
    get:
      operationId: categories_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - categories
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/comments/{id}/:
    get:
      operationId: comments_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this comment.
        required: true
      tags:
      - comments
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
    put:
      operationId: comments_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this comment.
        required: true
      tags:
      - comments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CommentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
    patch:
      operationId: comments_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this comment.
        required: true
      tags:
      - comments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCommentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCommentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCommentRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
    delete:
      operationId: comments_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this comment.
        required: true
      tags:
      - comments
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/compatibility/check/:
    post:
      operationId: compatibility_check_create
      description: Check an unsaved set of components. Used by the configurator for
        live feedback.
      tags:
      - compatibility
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompatibilityCheckRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompatibilityCheckRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompatibilityCheckRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatibilityReport'
          description: ''
  /api/components/:
    get:
      operationId: components_list
      parameters:
      - in: query
        name: buildable
        schema:
          type: boolean
        description: Only parts with complete specs (usable in the configurator).
      - in: query
        name: category
        schema:
          type: string
          enum:
          - case
          - cooler
          - cpu
          - gpu
          - motherboard
          - psu
          - ram
          - storage
        description: |-
          * `cpu` - Processor
          * `motherboard` - Motherboard
          * `ram` - Memory
          * `gpu` - Graphics card
          * `storage` - Storage
          * `psu` - Power supply
          * `case` - Case
          * `cooler` - CPU cooler
      - in: query
        name: compatible_with
        schema:
          type: string
        description: Comma-separated ids of already selected components. Only parts
          compatible with them are returned. Requires `category`.
      - in: query
        name: form_factor
        schema:
          type: string
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: manufacturer
        schema:
          type: string
      - in: query
        name: max_price
        schema:
          type: number
      - in: query
        name: memory_type
        schema:
          type: string
      - in: query
        name: min_price
        schema:
          type: number
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: socket
        schema:
          type: string
      tags:
      - components
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedComponentList'
          description: ''
    post:
      operationId: components_create
      tags:
      - components
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComponentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ComponentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ComponentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Component'
          description: ''
  /api/components/{slug}/:
    get:
      operationId: components_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - components
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Component'
          description: ''
    put:
      operationId: components_update
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - components
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComponentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ComponentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ComponentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Component'
          description: ''
    patch:
      operationId: components_partial_update
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - components
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedComponentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedComponentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedComponentRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Component'
          description: ''
    delete:
      operationId: components_destroy
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - components
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/components/{slug}/listings/:
    post:
      operationId: components_listings_create
      description: |-
        Staff: attach a product page URL. It is fetched right away, so the
        response already contains the title, price and photos found there.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - components
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ListingCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ListingCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
          description: ''
  /api/components/{slug}/price-history/:
    get:
      operationId: components_price_history_list
      description: 'Daily price points, oldest first: typical (median) price and the
        day''s range.'
      parameters:
      - in: query
        name: buildable
        schema:
          type: boolean
        description: Only parts with complete specs (usable in the configurator).
      - in: query
        name: category
        schema:
          type: string
          enum:
          - case
          - cooler
          - cpu
          - gpu
          - motherboard
          - psu
          - ram
          - storage
        description: |-
          * `cpu` - Processor
          * `motherboard` - Motherboard
          * `ram` - Memory
          * `gpu` - Graphics card
          * `storage` - Storage
          * `psu` - Power supply
          * `case` - Case
          * `cooler` - CPU cooler
      - in: query
        name: compatible_with
        schema:
          type: string
        description: Comma-separated component ids; requires `category`.
      - in: query
        name: days
        schema:
          type: integer
        description: 'Only the last N days (e.g. 30, 90, 180, 365). Default: everything.'
      - in: query
        name: form_factor
        schema:
          type: string
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: manufacturer
        schema:
          type: string
      - in: query
        name: max_price
        schema:
          type: number
      - in: query
        name: memory_type
        schema:
          type: string
      - in: query
        name: min_price
        schema:
          type: number
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: path
        name: slug
        schema:
          type: string
        required: true
      - in: query
        name: socket
        schema:
          type: string
      tags:
      - components
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceHistory'
          description: ''
  /api/exchange-rates/:
    get:
      operationId: exchange_rates_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - exchange-rates
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExchangeRateList'
          description: ''
  /api/exchange-rates/{id}/:
    get:
