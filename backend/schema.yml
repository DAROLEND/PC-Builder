components:
  schemas:
    AdvisorLanguageEnum:
      enum:
      - en
      - uk
      type: string
      description: |-
        * `en` - en
        * `uk` - uk
    AdvisorRequest:
      type: object
      properties:
        budget:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Amount in `currency`.
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          default: USD
          description: |-
            UAH budgets are converted at the latest NBU rate; the catalog plans in USD.

            * `USD` - USD
            * `UAH` - UAH
        use_case:
          $ref: '#/components/schemas/UseCaseEnum'
        preferences:
          type: string
          default: ''
          maxLength: 1000
        language:
          allOf:
          - $ref: '#/components/schemas/AdvisorLanguageEnum'
          default: en
          description: |-
            Language of the summary and notes.

            * `en` - en
            * `uk` - uk
      required:
      - budget
      - use_case
    AdvisorResponse:
      type: object
      properties:
        source:
          $ref: '#/components/schemas/SourceEnum'
        model:
          type: string
        summary:
          type: string
        notes:
          type: array
          items:
            type: string
        components:
          type: array
          items:
            $ref: '#/components/schemas/ComponentBrief'
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        budget:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          description: USD
        budget_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: The budget as entered, in `budget_currency`.
        budget_currency:
          $ref: '#/components/schemas/CurrencyEnum'
        compatibility:
          $ref: '#/components/schemas/CompatibilityReport'
      required:
      - budget
      - budget_amount
      - budget_currency
      - compatibility
      - components
      - model
      - notes
      - source
      - summary
      - total_price
    AlertLanguageEnum:
      enum:
      - uk
      - en
      type: string
      description: |-
        * `uk` - Українська
        * `en` - English
    BuildDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
        owner:
          type: string
          readOnly: true
        is_public:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/BuildItem'
          readOnly: true
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        compatibility:
          allOf:
          - $ref: '#/components/schemas/CompatibilityReport'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - compatibility
      - created_at
      - id
      - items
      - name
      - owner
      - total_price
      - updated_at
    BuildItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        component:
          allOf:
          - $ref: '#/components/schemas/ComponentBrief'
          readOnly: true
        quantity:
          type: integer
          maximum: 32767
          minimum: 0
        line_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - component
      - id
      - line_total
    BuildItemWriteRequest:
      type: object
      properties:
        component:
          type: integer
        quantity:
          type: integer
          maximum: 8
          minimum: 1
          default: 1
      required:
      - component
    BuildList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
        owner:
          type: string
          readOnly: true
        is_public:
          type: boolean
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        parts_count:
          type: integer
          readOnly: true
        comments_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - comments_count
      - created_at
      - id
      - name
      - owner
      - parts_count
      - total_price
      - updated_at
    BuildWriteRequest:
      type: object
      description: |-
        Create/update a build together with its component list.

        Validation is layered on purpose:
        * field level  – each item references an active component, quantity 1..8;
        * ``validate_items`` – no duplicate components in one request;
        * ``validate`` – cross-field domain rules via the compatibility engine.
          This is the place for them: they depend on *all* items at once, which
          no single field validator can see;
        * database – unique (build, component) and the quantity range are also
          constraints, so a bug in this serializer cannot corrupt data.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        is_public:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/BuildItemWriteRequest'
      required:
      - name
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          $ref: '#/components/schemas/CategoryKindEnum'
        name:
          type: string
          maxLength: 64
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        position:
          type: integer
          maximum: 32767
          minimum: 0
      required:
      - id
      - kind
      - name
      - slug
    CategoryKindEnum:
      enum:
      - cpu
      - motherboard
      - ram
      - gpu
      - storage
      - psu
      - case
      - cooler
      type: string
      description: |-
        * `cpu` - Processor
        * `motherboard` - Motherboard
        * `ram` - Memory
        * `gpu` - Graphics card
        * `storage` - Storage
        * `psu` - Power supply
        * `case` - Case
        * `cooler` - CPU cooler
    CategoryRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/CategoryKindEnum'
        name:
          type: string
          minLength: 1
          maxLength: 64
        slug:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        position:
          type: integer
          maximum: 32767
          minimum: 0
      required:
      - kind
      - name
      - slug
    CategoryStats:
      type: object
      properties:
        kind:
          type: string
        name:
          type: string
        components:
          type: integer
        avg_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        min_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        max_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - avg_price
      - components
      - kind
      - max_price
      - min_price
      - name
    Comment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        build:
          type: integer
          readOnly: true
        author:
          type: string
          readOnly: true
        text:
          type: string
          maxLength: 2000
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - build
      - created_at
      - id
      - text
    CommentRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - text
    CompatibilityCheckRequest:
      type: object
      description: Input of the stateless ``POST /compatibility/check/`` endpoint.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BuildItemWriteRequest'
      required:
      - items
    CompatibilityReport:
      type: object
      properties:
        is_compatible:
          type: boolean
        is_complete:
          type: boolean
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
        missing:
          type: array
          items:
            type: string
        estimated_wattage:
          type: integer
        recommended_psu_wattage:
          type: integer
      required:
      - errors
      - estimated_wattage
      - is_compatible
      - is_complete
      - missing
      - recommended_psu_wattage
      - warnings
    Component:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 128
        slug:
          type: string
          maxLength: 160
          pattern: ^[-a-zA-Z0-9_]+$
        sku:
          type: string
          maxLength: 64
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Price in USD
        price_uah:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          nullable: true
          readOnly: true
        specs:
          type: object
          additionalProperties: {}
        specs_complete:
          type: boolean
          readOnly: true
        missing_specs:
          type: array
          items:
            type: string
          readOnly: true
        popularity:
          type: integer
          readOnly: true
          nullable: true
          description: Interest index from the source (hotline.ua), 7-day average.
        popularity_rank:
          type: integer
          readOnly: true
          nullable: true
          description: 1 = most popular in its category.
        shop_count:
          type: integer
          readOnly: true
          nullable: true
          description: Shops selling it now (best listing); null = no market data.
