[project]
name = "pc-builder-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "RUF"]
ignore = ["RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q --reuse-db"
filterwarnings = [
    "ignore::DeprecationWarning:celery.*",
    "ignore:No directory at:UserWarning",
]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/admin.py"]
