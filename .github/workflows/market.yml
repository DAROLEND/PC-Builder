# Market data for a deployment without a Celery worker (Render's free plan):
# this job plays the worker's role and writes straight into the production
# database, photos included (MEDIA_STORAGE=db stores them in PostgreSQL).
#
# Setup: repository secret DATABASE_URL (the same URI the API uses).
# Daily: refresh prices, photos and badges. Manually (Run workflow): also import
# new products from N listing pages per category and load their price history.
name: Market data

on:
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:
    inputs:
      import_pages:
        description: "Listing pages per category to import (0 = only refresh)"
        default: "0"
        required: true

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_CONN_MAX_AGE: "0"
      DJANGO_SECRET_KEY: market-data-job
      MEDIA_STORAGE: db
      MARKET_FETCH_ENABLED: "1"
      # Price alerts right after the refresh (skipped without the token).
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      FRONTEND_URL: https://pcbuilder-ife5.onrender.com
      CELERY_TASK_ALWAYS_EAGER: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::Secret DATABASE_URL is not set; nothing to do."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .

      - uses: actions/checkout@v4
        if: steps.config.outputs.enabled == 'true'
      - uses: actions/setup-python@v5
        if: steps.config.outputs.enabled == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - if: steps.config.outputs.enabled == 'true'
        run: pip install -r requirements.txt

      - name: Migrate and update the NBU rate
        if: steps.config.outputs.enabled == 'true'
        run: |
          python manage.py migrate --noinput
          python manage.py update_exchange_rate

      - name: Import new products
        if: steps.config.outputs.enabled == 'true' && github.event.inputs.import_pages > 0
        run: python manage.py import_hotline --pages "${{ github.event.inputs.import_pages }}"

      - name: Refresh prices, photos and badges
        if: steps.config.outputs.enabled == 'true'
        run: python manage.py refresh_market

      - name: Load price history for parts that have none yet
        if: steps.config.outputs.enabled == 'true'
        run: python manage.py sync_price_history --missing
