name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pcbuilder
          POSTGRES_USER: pcbuilder
          POSTGRES_PASSWORD: pcbuilder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pcbuilder"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://pcbuilder:pcbuilder@localhost:5432/pcbuilder
      DJANGO_SECRET_KEY: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: OpenAPI schema is valid and committed
        run: |
          python manage.py spectacular --file schema.yml --validate --fail-on-warn
          git diff --exit-code schema.yml

      - name: Tests
        run: pytest --create-db --cov --cov-report=term-missing:skip-covered

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      # The TS types are generated from backend/schema.yml. If someone changed
      # the API and forgot to regenerate, this step fails before tsc does.
      - name: API types match the OpenAPI schema
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start the stack and smoke-test it
        run: |
          docker compose up -d --wait
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8080/api/categories/
          curl --fail http://localhost:8080/ | grep -q "<title>PC Builder</title>"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
