# Render's free plan puts the API to sleep after 15 idle minutes, and waking it
# takes up to a minute: the static frontend loads at once but stays empty until
# the API answers. A ping every 10 minutes keeps it awake (one always-on service
# fits in the free 750 instance-hours a month).
#
# /health/ does not touch the database, so Neon can still scale to zero between
# real visits (keeping it awake would burn the free compute hours); its own
# wake-up takes under a second. Scheduled runs may start a few minutes late;
# for a stricter schedule point an external monitor (cron-job.org, UptimeRobot)
# at the same URL.
#
# The URL defaults to the demo API; override it with the repository variable
# DEMO_API_URL (Settings → Secrets and variables → Actions → Variables).
name: Keep demo alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API (a cold start can take a minute)
        run: curl --fail --silent --show-error --retry 5 --retry-delay 20 --retry-all-errors --max-time 90 "${{ vars.DEMO_API_URL || 'https://pcbuilder-api-8qs9.onrender.com' }}/health/" -o /dev/null
