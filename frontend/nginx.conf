# Serves the React build and proxies the API, so the browser talks to a single
# origin: no CORS, and the same relative "/api" URLs work in dev and in Docker.

# Behind Caddy (HTTPS) the original scheme arrives in X-Forwarded-Proto; pass it
# on so Django knows the request was secure (secure cookies, CSRF). Without a
# proxy in front, fall back to nginx's own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 2m;

    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;  # the AI advisor can take a while
    }

    # Product photos (WebP copies written by the worker): static files, so nginx
    # serves them itself instead of tying up a Django worker per image.
    location ^~ /media/ {
        alias /srv/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths get the SPA.
    location / {
        try_files $uri /index.html;
    }
}
