# Serves the React build and proxies the API, so the browser talks to a single
# origin: no CORS, and the same relative "/api" URLs work in dev and in Docker.
server {
    listen 80;
    root /usr/share/nginx/html;

    location ~ ^/(api|admin|static|media)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # the AI advisor can take a while
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths get the SPA.
    location / {
        try_files $uri /index.html;
    }
}
